[project]
name = "baixeai-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"migrations/**" = ["E501"]
"app/tools/converter/documents.py" = ["E501"]  # LibreOffice XML profile literal

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "concurrency: real concurrent database access",
]

[tool.coverage.run]
source = ["app"]

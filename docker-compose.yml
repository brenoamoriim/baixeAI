# BaixeAI — development stack.  Start everything with:  docker compose up --build
# Postgres and Redis are NOT published on the host (ports 5432/6379 are often taken
# by other projects); only the API (8000) and the frontend (3000) are, on 127.0.0.1.
name: baixeai

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  SECRET_KEY: ${SECRET_KEY:-}
  SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-}
  GUEST_ID_HMAC_SECRET: ${GUEST_ID_HMAC_SECRET:-}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baixeai}:${POSTGRES_PASSWORD:-baixeai_dev_only}@db:5432/${POSTGRES_DB:-baixeai}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baixeai}:${POSTGRES_PASSWORD:-baixeai_dev_only}@db:5432/baixeai_test
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_only}@redis:6379/0
  STORAGE_LOCAL_ROOT: /data/storage
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM: ${EMAIL_FROM:-nao-responda@baixeai.local}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  ALERT_EMAIL: ${ALERT_EMAIL:-}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
  MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

# Engine workers (untrusted files: LibreOffice, libvips, FFmpeg, ONNX, yt-dlp): no secrets, no database URL.
x-engine-env: &engine-env
  APP_ENV: ${APP_ENV:-development}
  PROCESS_ROLE: engine
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_only}@redis:6379/0
  STORAGE_LOCAL_ROOT: /data/storage

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baixeai}
      POSTGRES_USER: ${POSTGRES_USER:-baixeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baixeai_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baixeai} -d ${POSTGRES_DB:-baixeai}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_only}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis_dev_only}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only}
    networks: [internal, dlnet, enginenet]

  migrate:
    build: { context: ./backend, target: dev }
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  api:
    build: { context: ./backend, target: dev }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage:/data/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal, edge]

  worker:
    build: { context: ./backend, target: dev }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]

  # Conversion workers: own network with only Redis (no Postgres, no internet), no secrets,
  # hardened and resource-capped. Every database write happens in the default worker.
  worker-light:
    build: { context: ./backend, target: worker-light }
    environment: *engine-env
    volumes:
      - ./backend:/app
      - storage:/data/storage
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 256
    depends_on:
      redis: { condition: service_healthy }
    networks: [enginenet]

  worker-media:
    build: { context: ./backend, target: worker-media }
    environment: *engine-env
    volumes:
      - ./backend:/app
      - storage:/data/storage
    tmpfs:
      - /tmp:size=2g,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    depends_on:
      redis: { condition: service_healthy }
    networks: [enginenet]

  worker-ai:
    build: { context: ./backend, target: worker-ai }
    environment: *engine-env
    volumes:
      - ./backend:/app
      - storage:/data/storage
    tmpfs:
      - /tmp:size=1g,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2
    pids_limit: 64
    depends_on:
      redis: { condition: service_healthy }
    networks: [enginenet]

  # Only route to the internet for downloads. Re-checks every destination (SSRF) and dials the
  # validated IP. Not reachable from the internal network, only from dlnet.
  egress-proxy:
    build: { context: ./backend, target: dev }
    command: ["python", "-m", "app.security.egress_proxy"]
    environment:
      APP_ENV: ${APP_ENV:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [dlnet, egress]

  # yt-dlp worker: no DATABASE_URL, no route to Postgres, no direct internet.
  worker-download:
    build: { context: ./backend, target: worker-download }
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROCESS_ROLE: engine
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_only}@redis:6379/0
      STORAGE_LOCAL_ROOT: /data/storage
      EGRESS_PROXY_URL: http://egress-proxy:3128
      HOME: /tmp
    volumes:
      - ./backend:/app
      - storage:/data/storage
    tmpfs:
      - /tmp:size=2g,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    depends_on:
      redis: { condition: service_healthy }
      egress-proxy: { condition: service_started }
    networks: [dlnet]

  beat:
    build: { context: ./backend, target: dev }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]

  # Entry point: http://localhost:8080 (same routing as production)
  proxy:
    image: caddy:2.11.7-alpine
    volumes:
      - ./infrastructure/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
      - frontend
    networks: [edge]

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks: [edge]

  # Optional, development only: public HTTPS URL for Mercado Pago webhooks (Cloudflare Quick Tunnel,
  # no account, no uptime guarantee, hostname changes on every start).
  #   docker compose --profile tunnel up -d tunnel ; docker compose logs tunnel | Select-String trycloudflare
  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:8080"]
    profiles: ["tunnel"]
    depends_on:
      - proxy
    networks: [edge]

  # Engine test runners (profile "tests"): same images as the engine workers, but with the TEST database so
  # the full-flow tests can run. Never started by `docker compose up`.
  #   docker compose --profile tests run --rm --build tests-light pytest tests/engines -o addopts=""
  tests-light:
    build: { context: ./backend, target: worker-light }
    profiles: ["tests"]
    environment: *backend-env
    volumes: [./backend:/app, storage:/data/storage]
    tmpfs: ["/tmp:size=1g,mode=1777"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
  tests-media:
    build: { context: ./backend, target: worker-media }
    profiles: ["tests"]
    environment: *backend-env
    volumes: [./backend:/app, storage:/data/storage]
    tmpfs: ["/tmp:size=2g,mode=1777"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
  tests-ai:
    build: { context: ./backend, target: worker-ai }
    profiles: ["tests"]
    environment: *backend-env
    volumes: [./backend:/app, storage:/data/storage]
    tmpfs: ["/tmp:size=1g,mode=1777"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    internal: true
  dlnet:
    internal: true
  enginenet:
    internal: true
  edge: {}
  egress: {}

volumes:
  pgdata:
  redisdata:
  storage:
